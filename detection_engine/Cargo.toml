[package]
name = "secrisk-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SecRisk correlation engine: groups normalized sensor events into process chains and scores them"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "secrisk-engine"
path = "src/main.rs"
